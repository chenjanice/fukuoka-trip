<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>福岡旅遊手冊</title>
<style>
  :root {
    --bg: #F3ECE0;
    --paper: #FBF7EF;
    --primary: #C1673F;
    --primary-dark: #9C4E2E;
    --primary-tint: #EFDCC9;
    --ink: #2C2620;
    --sub-ink: #8A7A68;
    --border: #E2D5C0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif TC", "Hiragino Mincho ProN", "Yu Mincho",
                 "游明體", "PMingLiU", "細明體", "STSong", serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 150px;
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  header.top h1 {
    margin: 0 0 10px;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    color: var(--primary-dark);
    font-weight: 700;
    text-align: center;
  }

  header.top h1 .sub {
    display: block;
    font-size: 0.7rem;
    color: var(--sub-ink);
    font-weight: 400;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* 底部導覽列（只剩口袋，已不需切換，隱藏之） */
  .bottom-nav {
    display: none;
  }

  .bottom-nav-inner {
    display: flex;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 2px 7px;
    border: none;
    background: none;
    color: var(--sub-ink);
    font-family: inherit;
    font-size: 0.68rem;
    line-height: 1.2;
    cursor: pointer;
  }

  .nav-btn .nav-icon {
    font-size: 1.15rem;
    line-height: 1;
  }

  .nav-btn.active {
    color: var(--primary);
    font-weight: 700;
  }

  .search-wrap {
    position: relative;
  }

  #search {
    width: 100%;
    padding: 10px 34px 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--paper);
    font-size: 0.95rem;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }

  #search:focus {
    border-color: var(--primary);
  }

  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--sub-ink);
    font-size: 0.85rem;
    cursor: pointer;
    display: none;
    background: none;
    border: none;
    padding: 4px;
  }

  /* 類別列：沿用原本底部導覽列的樣式 */
  nav.tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 35;
    display: flex;
    background: var(--paper);
    border-top: 1px solid var(--border);
    /* 寬螢幕時讓按鈕集中在 560px 內 */
    padding: 0 max(0px, calc((100% - 560px) / 2)) env(safe-area-inset-bottom, 0);
    box-shadow: 0 -1px 6px rgba(60, 45, 25, 0.06);
  }

  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 2px 7px;
    border: none;
    background: none;
    color: var(--sub-ink);
    font-family: inherit;
    font-size: 0.68rem;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab-btn .nav-icon {
    font-size: 1.15rem;
    line-height: 1;
  }

  .tab-btn.active {
    color: var(--primary);
    font-weight: 700;
  }

  /* 區域篩選列 */
  .zone-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 16px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .zone-bar::-webkit-scrollbar { display: none; }

  .zone-chip {
    flex: 0 0 auto;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--sub-ink);
    font-family: inherit;
    font-size: 0.78rem;
    white-space: nowrap;
    cursor: pointer;
  }

  .zone-chip .zone-count {
    opacity: 0.65;
    margin-left: 3px;
  }

  .zone-chip.active {
    background: var(--primary-tint);
    border-color: var(--primary);
    color: var(--primary-dark);
    font-weight: 700;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 2px;
    font-size: 0.78rem;
    color: var(--sub-ink);
  }

  .status-bar .filter-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
  }

  .status-bar .filter-toggle input {
    accent-color: var(--primary);
  }

  main {
    padding: 10px 16px 20px;
  }

  .section-title {
    font-size: 0.95rem;
    color: var(--primary-dark);
    font-weight: 700;
    margin: 4px 0 10px;
    padding-left: 2px;
    border-left: 4px solid var(--primary);
    padding-left: 8px;
  }

  .card {
    position: relative;
    background: var(--paper);
    border-radius: 16px;
    padding: 18px 118px 16px 20px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(60, 45, 25, 0.08);
    transition: opacity 0.15s ease;
  }

  .card.starred {
    box-shadow: 0 0 0 1.5px var(--primary), 0 1px 3px rgba(60, 45, 25, 0.08);
  }

  .card.learned {
    opacity: 0.55;
  }

  .card .cat-chip {
    display: inline-block;
    font-size: 0.68rem;
    color: var(--primary-dark);
    background: var(--primary-tint);
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }

  .card .jp {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .card .meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--sub-ink);
  }

  .card .meta .dot {
    color: var(--border);
    font-size: 0.7rem;
  }

  .card .meta .romaji {
    font-family: "Courier New", monospace;
    letter-spacing: 0.01em;
  }

  .card .zh {
    font-size: 1.05rem;
    font-weight: 700;
    margin-top: 12px;
    color: var(--ink);
  }

  .card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .card .tags .tag {
    font-size: 0.78rem;
    color: var(--primary-dark);
    background: var(--primary-tint);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .card .note {
    font-size: 0.88rem;
    color: var(--sub-ink);
    margin-top: 10px;
    line-height: 1.6;
  }

  /* 口袋卡片：上方縮圖，按鈕浮在圖片上 */
  .card.place {
    padding: 0 20px 16px;
    overflow: hidden;
  }

  .card.place.no-img {
    padding: 18px 118px 16px 20px;
  }

  .place-thumb {
    display: block;
    width: calc(100% + 40px);
    height: 150px;
    margin: 0 -20px 12px;
    object-fit: cover;
    background: var(--primary-tint);
  }

  .card.place:not(.no-img) .map-link,
  .card.place:not(.no-img) .star-toggle,
  .card.place:not(.no-img) .learn-toggle {
    background-color: var(--paper);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
  }

  .card.place:not(.no-img) .map-link,
  .card.place:not(.no-img):not(.starred) .star-toggle,
  .card.place:not(.no-img):not(.learned) .learn-toggle {
    border-color: transparent;
  }

  .card.place.learned .learn-toggle {
    background-color: var(--primary);
  }

  .card .rating {
    margin-top: 2px;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }

  .card .rating .on { color: #e0a526; }
  .card .rating .off { color: var(--border); }

  .card .desc {
    font-size: 0.92rem;
    color: var(--ink);
    margin-top: 6px;
    line-height: 1.6;
  }

  /* 地圖 icon 按鈕：放在星星左邊 */
  .map-link {
    position: absolute;
    top: 16px;
    right: 84px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    text-decoration: none;
    line-height: 1;
  }

  .map-link:active {
    background: var(--primary-tint);
    border-color: var(--primary);
  }

  /* 行程卡片沒有星星／打勾，地圖 icon 直接靠右 */
  .card.sched .map-link,
  .card.backup .map-link {
    right: 16px;
  }

  .learn-toggle,
  .star-toggle {
    position: absolute;
    top: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--border);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }

  .learn-toggle {
    right: 16px;
  }

  .learn-toggle::after {
    content: "✓";
  }

  .card.learned .learn-toggle {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .star-toggle {
    right: 50px;
    color: var(--sub-ink);
    font-size: 1rem;
  }

  .star-toggle::after {
    content: "☆";
  }

  .card.starred .star-toggle {
    border-color: #E0A93A;
    color: #E0A93A;
  }

  .card.starred .star-toggle::after {
    content: "★";
  }

  .empty-hint {
    text-align: center;
    color: var(--sub-ink);
    font-size: 0.9rem;
    padding: 40px 10px;
  }

  /* 行程卡片 */
  .card.sched {
    padding: 16px 56px 16px 20px;
    border-left: 4px solid var(--primary);
  }

  .card.sched .sched-time {
    font-family: "Courier New", monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: 0.02em;
  }

  .card.sched .jp {
    font-size: 1.2rem;
    margin-top: 4px;
  }

  .card.backup {
    padding: 14px 56px 14px 20px;
    background: transparent;
    border: 1px dashed var(--border);
    box-shadow: none;
  }

  .card.backup .jp {
    font-size: 1.05rem;
    font-weight: 400;
  }

  .sub-heading {
    font-size: 0.8rem;
    color: var(--sub-ink);
    margin: 20px 0 10px;
    padding-left: 2px;
  }

  .day-badge {
    display: inline-block;
    font-size: 0.68rem;
    background: var(--primary);
    color: #fff;
    border-radius: 999px;
    padding: 2px 9px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* 購物子項目 */
  .subs {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sub-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    width: 100%;
    text-align: left;
    padding: 7px 4px;
    border: none;
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    border-radius: 6px;
  }

  .sub-row .box {
    flex: 0 0 auto;
    width: 19px;
    height: 19px;
    margin-top: 1px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    color: transparent;
    line-height: 1;
  }

  .sub-row.done .box {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .sub-row.done .sub-text {
    color: var(--sub-ink);
    text-decoration: line-through;
  }

  .sub-progress {
    font-size: 0.75rem;
    color: var(--sub-ink);
    margin-top: 6px;
  }

  /* 機票頁 */
  .flight-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 0;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(60, 45, 25, 0.08);
    overflow: hidden;
  }

  .flight-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--primary);
    color: #fff;
    padding: 9px 16px;
    font-size: 0.82rem;
  }

  .flight-head .fno {
    font-family: "Courier New", monospace;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }

  .flight-body {
    display: flex;
    align-items: flex-start;
    padding: 18px 16px 16px;
    gap: 10px;
  }

  .flight-end {
    flex: 1 1 0;
    min-width: 0;
  }

  .flight-end.right { text-align: right; }

  .flight-code {
    font-size: 1.75rem;
    font-weight: 700;
    font-family: "Courier New", monospace;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .flight-time {
    font-size: 1.35rem;
    font-weight: 700;
    font-family: "Courier New", monospace;
    margin-top: 6px;
    color: var(--primary-dark);
  }

  .flight-city {
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .flight-term {
    font-size: 0.75rem;
    color: var(--sub-ink);
    margin-top: 2px;
  }

  .flight-mid {
    flex: 0 0 auto;
    text-align: center;
    padding-top: 8px;
    color: var(--sub-ink);
  }

  .flight-mid .arrow {
    font-size: 1.1rem;
    color: var(--primary);
  }

  .flight-mid .dur {
    font-size: 0.68rem;
    margin-top: 4px;
    white-space: nowrap;
  }

  .flight-foot {
    border-top: 1px dashed var(--border);
    padding: 12px 16px;
    font-size: 0.8rem;
    color: var(--sub-ink);
  }

  .ref-box {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .ref-box > div {
    flex: 1;
    background: var(--primary-tint);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .ref-box .k {
    font-size: 0.7rem;
    color: var(--primary-dark);
  }

  .ref-box .v {
    font-size: 1.15rem;
    font-weight: 700;
    font-family: "Courier New", monospace;
    letter-spacing: 0.06em;
    margin-top: 2px;
    color: var(--ink);
  }

  /* 住宿頁 */
  .hotel-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(60, 45, 25, 0.08);
  }

  .hotel-name-ja {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.35;
  }

  .hotel-name-sub {
    font-size: 0.8rem;
    color: var(--sub-ink);
    margin-top: 4px;
  }

  .hotel-name-en {
    font-size: 0.9rem;
    color: var(--primary-dark);
    margin-top: 6px;
    letter-spacing: 0.01em;
  }

  .hotel-rows {
    margin-top: 16px;
    border-top: 1px solid var(--border);
  }

  .hotel-row {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .hotel-row:last-child { border-bottom: none; }

  .hotel-row .label {
    flex: 0 0 62px;
    color: var(--sub-ink);
    font-size: 0.82rem;
    padding-top: 2px;
  }

  .hotel-row .val { flex: 1 1 auto; min-width: 0; }

  .hotel-row .val a {
    color: var(--primary-dark);
    text-decoration: none;
    border-bottom: 1px solid var(--primary-tint);
  }

  .inout {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .inout div {
    flex: 1;
    background: var(--primary-tint);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }

  .inout .k {
    font-size: 0.72rem;
    color: var(--primary-dark);
  }

  .inout .v {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink);
    font-family: "Courier New", monospace;
    margin-top: 2px;
  }

  .hotel-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .hotel-actions a {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    text-decoration: none;
  }

  .hotel-actions a.ghost {
    background: transparent;
    color: var(--primary-dark);
    border: 1.5px solid var(--primary);
  }

  /* 給司機看的大字卡 */
  .show-card {
    background: #fff;
    border: 2px solid var(--primary);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .show-card .show-label {
    display: inline-block;
    font-size: 0.72rem;
    background: var(--primary);
    color: #fff;
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 14px;
  }

  .show-card .show-line {
    font-size: 1.45rem;
    font-weight: 700;
    line-height: 1.5;
    color: #000;
  }

  .show-card .show-addr {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.5;
    color: #000;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }

  .show-card .show-tel {
    font-size: 1.2rem;
    margin-top: 12px;
    font-family: "Courier New", monospace;
    color: #000;
  }

  .show-card .show-zh {
    font-size: 0.8rem;
    color: var(--sub-ink);
    margin-top: 12px;
  }

  .phrase-tag {
    display: inline-block;
    font-size: 0.68rem;
    color: var(--primary-dark);
    background: var(--primary-tint);
    border-radius: 999px;
    padding: 2px 8px;
    margin-bottom: 8px;
  }

  /* 化妝步驟 */
  .step {
    display: flex;
    gap: 14px;
    background: var(--paper);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(60, 45, 25, 0.08);
  }

  .step-num {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .step-body {
    flex: 1 1 auto;
    min-width: 0;
  }

  .step-title {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.3;
    padding-top: 3px;
  }

  .step-subs {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
    counter-reset: substep;
  }

  .step-subs > li {
    position: relative;
    padding-left: 26px;
    margin-bottom: 8px;
    font-size: 0.98rem;
    line-height: 1.5;
  }

  .step-subs > li::before {
    counter-increment: substep;
    content: counter(substep) ".";
    position: absolute;
    left: 0;
    top: 0;
    color: var(--primary);
    font-weight: 700;
    font-size: 0.85rem;
  }

  .step-bullets {
    list-style: none;
    margin: 6px 0 0;
    padding: 0;
  }

  .step-bullets li {
    position: relative;
    padding-left: 14px;
    margin-top: 4px;
    font-size: 0.88rem;
    color: var(--sub-ink);
    line-height: 1.5;
  }

  .step-bullets li::before {
    content: "–";
    position: absolute;
    left: 0;
    top: 0;
  }

  /* Floating rescue button */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 1.4rem;
    box-shadow: 0 3px 10px rgba(60, 30, 10, 0.35);
    z-index: 30;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  // ---------- 狀態 ----------
  const LS_KEY = "fukuoka-vocab-learned-v1";
  const LS_STAR_KEY = "fukuoka-vocab-starred-v1";
  const LS_BUCKET_VISITED_KEY = "fukuoka-bucket-visited-v1";
  const LS_BUCKET_STAR_KEY = "fukuoka-bucket-starred-v1";

  let starred = {};
  let visited = {};
  let bucketStarred = {};
  try { learned = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { learned = {}; }

  let mode = "bucket"; // 只保留口袋頁面

  // 把細碎的地點名稱歸到大區域，方便篩選
  const ZONE_KEYWORDS = ["天神", "博多", "藥院", "柳橋", "中央區", "大濠公園", "中洲", "百道濱", "糸島", "太宰府", "柳川", "福岡巨蛋"];

  function zoneOf(area) {
    if (!area || area === "—") return "其他";
    if (/警固/.test(area)) return "天神";      // 警固神社在天神商圈
    if (/舞鶴/.test(area)) return "大濠公園";
    for (const z of ZONE_KEYWORDS) {
      if (area.indexOf(z) !== -1) return z;
    }
    return "其他";
  }

  // 取出某分類裡出現過的區域＋各自筆數，依首次出現順序排列
  function zonesOf(cat) {
    const order = [];
    const counts = {};
    cat.items.forEach(item => {
      const z = zoneOf(item.area);
      if (counts[z] === undefined) { counts[z] = 0; order.push(z); }
      counts[z]++;
    });
    return order.map(z => ({ zone: z, count: counts[z] }));
  }

      statusBar: true,

      starLabel: "只看想去",
      showUnlearned: false
    }
  };

  function currentCategories() {

    if (mode === "vocab") activeCatId = id;

    return "c" + catId + "-i" + idx;

  // ---------- 模式切換 ----------
  modeSwitchEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".nav-btn");
    if (!btn) return;
    mode = btn.dataset.mode;
    modeSwitchEl.querySelectorAll(".nav-btn").forEach(b => {
      b.classList.toggle("active", b === btn);
    });
    searchQuery = "";
    searchEl.value = "";
    searchClearEl.style.display = "none";
    onlyStarred = false;
    onlyStarredEl.checked = false;
    onlyUnlearned = false;
    onlyUnlearnedEl.checked = false;
    activeZone = null;
    applyModeChrome();
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
  });

  // ---------- 區域篩選 ----------
  function renderZoneBar() {
    // 只有口袋清單、且不在搜尋狀態時才顯示
    if (mode !== "bucket" || searchQuery) {
      zoneBarEl.style.display = "none";
      zoneBarEl.innerHTML = "";
      return;
    }
    const cat = bucketCategories.find(c => c.id === activeBucketCatId) || bucketCategories[0];
    const zones = zonesOf(cat);
    // 只有一個區域就沒必要顯示篩選
    if (zones.length < 2) {
      zoneBarEl.style.display = "none";
      zoneBarEl.innerHTML = "";
      return;
    }
    zoneBarEl.style.display = "flex";
    zoneBarEl.innerHTML =
      '<button class="zone-chip' + (activeZone === null ? ' active' : '') + '" data-zone="">' +
        '全部<span class="zone-count">' + cat.items.length + '</span></button>' +
      zones.map(z => (
        '<button class="zone-chip' + (activeZone === z.zone ? ' active' : '') + '" data-zone="' + escapeHtml(z.zone) + '">' +
          escapeHtml(z.zone) + '<span class="zone-count">' + z.count + '</span></button>'
      )).join("");
  }

  zoneBarEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".zone-chip");
    if (!chip) return;
    activeZone = chip.dataset.zone || null;
    render();
  });

  // 依模式調整搜尋框、篩選列的顯示
  function applyModeChrome() {
    const cfg = modeConfig[mode];
    searchWrapEl.style.display = cfg.search ? "block" : "none";
    if (cfg.search) searchEl.placeholder = cfg.searchPlaceholder;
    onlyUnlearnedLabelEl.style.display = cfg.showUnlearned ? "flex" : "none";
    if (cfg.starLabel) starLabelTextEl.textContent = cfg.starLabel;
    starLabelEl.style.display = cfg.statusBar ? "flex" : "none";
  }

  // ---------- 建立 Tabs ----------
  function renderTabs() {
    const cats = currentCategories();
    if (!cats.length) {
      tabsEl.style.display = "none";
      tabsEl.innerHTML = "";
      return;
    }
    tabsEl.style.display = "flex";
    const activeId = currentActiveCatId();
    const cfg = modeConfig[mode];
    tabsEl.innerHTML = cats.map(cat => (
      '<button class="tab-btn' + (cat.id === activeId && !searchQuery ? ' active' : '') + '" data-cat="' + cat.id + '">' +
        (cfg.tabLabel ? cfg.tabLabel(cat) : '<span class="nav-icon">' + cat.icon + '</span>' + cat.name) +
      '</button>'
    )).join("");
  }

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    setActiveCatId(Number(btn.dataset.cat));
    searchQuery = "";
    searchEl.value = "";
    searchClearEl.style.display = "none";
    activeZone = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- 卡片 HTML ----------
  function cardHtml(item, catId, idx, showChip) {
    const key = itemKey(catId, idx);
    const isLearned = !!learned[key];
    const isStarred = !!starred[key];
    const cat = categories.find(c => c.id === catId);
    return (
      '<div class="card' + (isLearned ? ' learned' : '') + (isStarred ? ' starred' : '') + '" data-key="' + key + '">' +
        (showChip && cat ? '<span class="cat-chip">' + cat.icon + ' ' + cat.name + '</span><br>' : '') +
        '<div class="jp">' + item.jp + '</div>' +
        '<div class="meta"><span class="kana">' + item.kana + '</span><span class="dot">•</span><span class="romaji">' + item.romaji + '</span></div>' +
        '<div class="zh">' + item.zh + '</div>' +
        '<button class="star-toggle" data-key="' + key + '" aria-label="收藏"></button>' +
        '<button class="learn-toggle" data-key="' + key + '" aria-label="標記已學會"></button>' +
      '</div>'
    );
  }

  // ---------- 口袋清單卡片 HTML ----------
  function bucketCardHtml(item, catId, idx, showChip) {
    const key = itemKey(catId, idx);
    const isVisited = !!visited[key];
    const isStarred = !!bucketStarred[key];
    const cat = bucketCategories.find(c => c.id === catId);
    const tags = [item.area, item.type].filter(t => t && t !== "—");
    const rating = item.stars
      ? '<div class="rating" aria-label="網路推薦 ' + item.stars + ' 顆星">' +
          '<span class="on">' + "★".repeat(item.stars) + '</span>' +
          '<span class="off">' + "★".repeat(3 - item.stars) + '</span>' +
        '</div>'
      : '';
    return (
      '<div class="card place' + (item.img ? '' : ' no-img') + (isVisited ? ' learned' : '') + (isStarred ? ' starred' : '') + '" data-key="' + key + '">' +
        (item.img ? '<img class="place-thumb" src="' + escapeHtml(item.img) + '"' + (item.imgPos ? ' style="object-position:' + escapeHtml(item.imgPos) + '"' : '') + ' alt="' + escapeHtml(item.name) + '" loading="lazy">' : '') +
        (showChip && cat ? '<span class="cat-chip">' + cat.icon + ' ' + cat.name + '</span><br>' : '') +
        '<div class="jp">' + escapeHtml(item.name) + '</div>' +
        rating +
        (item.desc ? '<div class="desc">' + escapeHtml(item.desc) + '</div>' : '') +
        (tags.length ? '<div class="tags">' + tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join("") + '</div>' : '') +
        (item.note ? '<div class="note">' + escapeHtml(item.note) + '</div>' : '') +
        mapLinkHtml(item.map) +
        '<button class="star-toggle" data-key="' + key + '" aria-label="想去"></button>' +
        '<button class="learn-toggle" data-key="' + key + '" aria-label="已經去過"></button>' +
      '</div>'
    );
  }

  // 地圖 icon（新視窗開啟，手機會直接跳 Google Maps App）
  function mapLinkHtml(url) {
    if (!url) return '';
    return '<a class="map-link" href="' + escapeHtml(url) +
      '" target="_blank" rel="noopener noreferrer" title="在 Google 地圖開啟" aria-label="在 Google 地圖開啟">📍</a>';
  }

  // ---------- 渲染主內容 ----------
  function render() {
    renderTabs();
    renderZoneBar();

    if (mode === "vocab") renderVocab();
    else if (mode === "bucket") renderBucket();
  }

  function renderVocab() {
    let listHtml = "";
    let totalCount = 0;
    let learnedCount = 0;

    if (searchQuery) {
      // 全類別搜尋
      const q = searchQuery.toLowerCase();
      let results = [];
      categories.forEach(cat => {
        cat.items.forEach((item, idx) => {
          const hay = (item.jp + item.zh + item.kana + item.romaji).toLowerCase();
          if (hay.includes(q)) {
            results.push({ item, catId: cat.id, idx });
          }
        });
      });

      totalCount = results.length;
      results.forEach(r => {
        if (learned[itemKey(r.catId, r.idx)]) learnedCount++;
      });

      if (onlyUnlearned) {
        results = results.filter(r => !learned[itemKey(r.catId, r.idx)]);
      }
      if (onlyStarred) {
        results = results.filter(r => !!starred[itemKey(r.catId, r.idx)]);
      }

      if (results.length === 0) {
        listHtml = '<div class="empty-hint">沒有符合「' + escapeHtml(searchQuery) + '」的單字</div>';
      } else {
        listHtml = '<div class="section-title">搜尋結果（' + results.length + '）</div>' +
          results.map(r => cardHtml(r.item, r.catId, r.idx, true)).join("");
      }

      statusBarEl.style.display = totalCount > 0 ? "flex" : "none";
    } else {
      const cat = categories.find(c => c.id === activeCatId) || categories[0];
      totalCount = cat.items.length;
      cat.items.forEach((item, idx) => {
        if (learned[itemKey(cat.id, idx)]) learnedCount++;
      });

      let items = cat.items.map((item, idx) => ({ item, idx }));
      if (onlyUnlearned) {
        items = items.filter(x => !learned[itemKey(cat.id, x.idx)]);
      }
      if (onlyStarred) {
        items = items.filter(x => !!starred[itemKey(cat.id, x.idx)]);
      }

      listHtml = '<div class="section-title">' + cat.icon + ' ' + cat.name + '</div>' +
        (items.length === 0
          ? '<div class="empty-hint">' + (onlyStarred ? '這個分類還沒有收藏的單字 ☆' : '這個分類全部都已學會了 🎉') + '</div>'
          : items.map(x => cardHtml(x.item, cat.id, x.idx, false)).join(""));

      statusBarEl.style.display = "flex";
    }

    mainEl.innerHTML = listHtml;
    progressTextEl.textContent = "已學會 " + learnedCount + " / " + totalCount;
  }

  function renderBucket() {
    let listHtml = "";
    let totalCount = 0;
    let visitedCount = 0;

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      let results = [];
      bucketCategories.forEach(cat => {
        cat.items.forEach((item, idx) => {
          const hay = (item.name + item.area + item.type + item.note).toLowerCase();
          if (hay.includes(q)) {
            results.push({ item, catId: cat.id, idx });
          }
        });
      });

      totalCount = results.length;
      results.forEach(r => {
        if (visited[itemKey(r.catId, r.idx)]) visitedCount++;
      });

      if (onlyStarred) {
        results = results.filter(r => !!bucketStarred[itemKey(r.catId, r.idx)]);
      }

      if (results.length === 0) {
        listHtml = '<div class="empty-hint">沒有符合「' + escapeHtml(searchQuery) + '」的地點</div>';
      } else {
        listHtml = '<div class="section-title">搜尋結果（' + results.length + '）</div>' +
          results.map(r => bucketCardHtml(r.item, r.catId, r.idx, true)).join("");
      }

      statusBarEl.style.display = totalCount > 0 ? "flex" : "none";
    } else {
      const cat = bucketCategories.find(c => c.id === activeBucketCatId) || bucketCategories[0];

      let items = cat.items.map((item, idx) => ({ item, idx }));
      // 區域篩選
      if (activeZone) {
        items = items.filter(x => zoneOf(x.item.area) === activeZone);
      }

      // 進度以「目前篩選範圍」為分母，比較符合直覺
      totalCount = items.length;
      items.forEach(x => {
        if (visited[itemKey(cat.id, x.idx)]) visitedCount++;
      });

      if (onlyStarred) {
        items = items.filter(x => !!bucketStarred[itemKey(cat.id, x.idx)]);
      }

      const title = cat.icon + ' ' + cat.name + (activeZone ? '｜' + escapeHtml(activeZone) : '');
      listHtml = '<div class="section-title">' + title + '</div>' +
        (items.length === 0
          ? '<div class="empty-hint">' + (onlyStarred ? '這個範圍還沒有想去的地點 ☆' : '這個區域沒有地點') + '</div>'
          : items.map(x => bucketCardHtml(x.item, cat.id, x.idx, false)).join(""));

      statusBarEl.style.display = "flex";
    }

    mainEl.innerHTML = listHtml;
    progressTextEl.textContent = "已去過 " + visitedCount + " / " + totalCount;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ---------- 事件：卡片打勾／收藏 ----------
  mainEl.addEventListener("click", (e) => {
    const learnBtn = e.target.closest(".learn-toggle");
    if (learnBtn) {
      const key = learnBtn.dataset.key;
      if (mode === "vocab") {
        learned[key] = !learned[key];
        saveLearned();
      } else if (mode === "bucket") {
        visited[key] = !visited[key];
        saveVisited();
      }
      render();
      return;
    }
    const starBtn = e.target.closest(".star-toggle");
    if (starBtn) {
      const key = starBtn.dataset.key;
      if (mode === "vocab") {
        starred[key] = !starred[key];
        saveStarred();
      } else if (mode === "bucket") {
        bucketStarred[key] = !bucketStarred[key];
        saveBucketStarred();
      }
      render();
      return;
    }
  });

  // ---------- 事件：搜尋 ----------
  searchEl.addEventListener("input", () => {
    searchQuery = searchEl.value.trim();
    searchClearEl.style.display = searchQuery ? "block" : "none";
    render();
  });

  searchClearEl.addEventListener("click", () => {
    searchEl.value = "";
    searchQuery = "";
    searchClearEl.style.display = "none";
    render();
    searchEl.focus();
  });

  // ---------- 事件：只看未學會 ----------
  onlyUnlearnedEl.addEventListener("change", () => {
    onlyUnlearned = onlyUnlearnedEl.checked;
    render();
  });

  onlyStarredEl.addEventListener("change", () => {
    onlyStarred = onlyStarredEl.checked;
    render();
  });

  // ---------- 救命卡 Modal ----------
  const fabBtn = document.getElementById("fabBtn");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalClose = document.getElementById("modalClose");
  const modalBody = document.getElementById("modalBody");
  const modalTitle = document.getElementById("modalTitle");
  const modalTabsBtns = document.querySelectorAll(".modal-tabs button");
  let modalMode = "rescue";

  function renderModal() {
    if (modalMode === "rescue") {
      modalTitle.textContent = "快速救命卡";
      modalBody.innerHTML = rescuePhrases.map((p, i) => (
        '<div class="rescue-item">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="jp">' + p.jp + '</div>' +
          '<div class="kana">' + p.kana + '</div>' +
          '<div class="zh">' + p.zh + '</div>' +
          '<div class="romaji">' + p.romaji + '</div>' +
        '</div>'
      )).join("");
    } else {
      modalTitle.textContent = "發音小提醒";
      modalBody.innerHTML = pronunciationTips.map(tip => (
        '<div class="tip-item">' + tip + '</div>'
      )).join("");
    }
    modalTabsBtns.forEach(b => b.classList.toggle("active", b.dataset.modal === modalMode));
  }

  fabBtn.addEventListener("click", () => {
    modalMode = "rescue";
    renderModal();
    modalBackdrop.classList.add("open");
  });

  modalClose.addEventListener("click", () => {
    modalBackdrop.classList.remove("open");
  });

  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
  });

  modalTabsBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      modalMode = btn.dataset.modal;
      renderModal();
    });
  });

  // ---------- 初始化 ----------
  applyModeChrome();
  render();
</script>
</body>
</html>
